name: DMI Hostel PWA - Continuous Integration

on:
  push:
    branches: [main, master, develop, dev]
  pull_request:
    branches: [main, master, develop, dev]

jobs:
  audit-and-test:
    name: Build, Audit & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Next.js Production Bundle
        run: bun run build

      - name: Verify Bundle Integrity
        run: |
          test -d .next
          echo "Build successful: All routes compiled cleanly."
